name: space-cursors-patch6

on:
  push:
    branches:
      - fix/space-cursors-6

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/space-cursors-6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: node tools/space-cursors-patch6.js

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/space.js
          node --check public/device-presence.js
          node --check public/sw.js

      - name: Verify redirect intact
        run: |
          grep -q "space.crlx1q.com" server.js
          grep -q "clientId: socket.data?.clientId," server.js

      - name: Verify client changes
        run: |
          grep -q "clientId: DEVICE_ID," public/space.js
          grep -q "deviceCursorColor" public/space.js

      - name: Remove one-shot runner
        run: |
          rm -f tools/space-cursors-patch6.js
          rm -f .github/workflows/space-cursors-patch6.yml

      - name: Commit
        run: |
          git config user.name "space-patch-bot"
          git config user.email "space-patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(space): separate cursor per device with device icon and shade"
          git push origin HEAD:fix/space-cursors-6
