name: space-tablist-patch3

on:
  push:
    branches:
      - fix/space-tablist-3

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/space-tablist-3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: node tools/space-tablist-patch3.js

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/space.js
          node --check public/device-presence.js

      - name: Verify redirect intact
        run: grep -q "space.crlx1q.com" server.js

      - name: Verify email updated
        run: grep -q "support@crlx1q.com" public/index.html

      - name: Remove one-shot runner
        run: |
          rm -f tools/space-tablist-patch3.js
          rm -f .github/workflows/space-tablist-patch3.yml

      - name: Commit
        run: |
          git config user.name "space-patch-bot"
          git config user.email "space-patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(space): tab-list presence (always show me + everyone's devices); support@crlx1q.com"
          git push origin HEAD:fix/space-tablist-3
