name: Apply space device-presence patch

on:
  push:
    paths:
      - 'tools/space-device-presence-patch.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch (fails if any anchor is missing)
        run: node tools/space-device-presence-patch.js

      - name: Sanity check
        run: |
          node --check server.js
          node --check public/space.js
          node --check public/device-presence.js
          grep -q "space.crlx1q.com" server.js

      - name: Commit result and remove the one-shot runner
        run: |
          rm -f tools/space-device-presence-patch.js
          rm -f .github/workflows/space-device-presence-patch.yml
          rmdir tools 2>/dev/null || true
          git config user.name "space-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(space): per-device presence + realtime sync across devices of one account; AI notes always get body text"
          git push
