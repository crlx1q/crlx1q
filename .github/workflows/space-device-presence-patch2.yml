name: space-device-presence-patch2

on:
  push:
    branches:
      - fix/space-device-presence-2

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/space-device-presence-2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: node tools/space-device-presence-patch2.js

      - name: Syntax check
        run: |
          node --check server.js
          node --check public/space.js
          node --check public/device-presence.js

      - name: Verify redirect intact
        run: grep -q "space.crlx1q.com" server.js

      - name: Remove one-shot runner
        run: |
          rm -f tools/space-device-presence-patch2.js
          rm -f .github/workflows/space-device-presence-patch2.yml

      - name: Commit
        run: |
          git config user.name "space-patch-bot"
          git config user.email "space-patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(space): count devices not people, dedupe sessions per device, cross-device cursors, svg device icons"
          git push origin HEAD:fix/space-device-presence-2
